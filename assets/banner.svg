    <text x="16" y="74" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Agent 3: Model Serving</text>
    <text x="16" y="96" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">FastAPI &amp; Live Playground</text>
  </g>

  <!-- Footer Tag -->
  <text x="600" y="390" text-anchor="middle" fill="#52525B" font-family="-apple-system, monospace" font-size="11" letter-spacing="1">
