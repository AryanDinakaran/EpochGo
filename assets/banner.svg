<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="420" rx="24" fill="#0D0D11"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" stroke="#27272A" stroke-width="2"/>
  
  <!-- Subtle Gradient Accent Glow -->
  <circle cx="600" cy="180" r="280" fill="#0071E3" fill-opacity="0.08" filter="blur(80px)"/>
  <circle cx="950" cy="80" r="180" fill="#6366F1" fill-opacity="0.06" filter="blur(70px)"/>
  
  <!-- Top Pill -->
  <rect x="475" y="48" width="250" height="32" rx="16" fill="#1C1C20" stroke="#3F3F46" stroke-width="1"/>
  <circle cx="493" cy="64" r="4" fill="#10B981"/>
  <text x="506" y="68" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">EPOCHLYPSE RESEARCH</text>

  <!-- Title -->
  <text x="600" y="145" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Epoch<tspan fill="#0071E3">Go</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
    Autonomous, Local-First Multi-Agent AutoML Platform
  </text>

  <!-- 3 Pillars Cards -->
  <!-- Card 1 -->
  <g transform="translate(180, 230)">
    <rect width="240" height="120" rx="16" fill="#161619" stroke="#27272A" stroke-width="1"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#F59E0B" fill-opacity="0.15"/>
    <text x="24" y="38" fill="#F59E0B" font-size="16">🧹</text>
    <text x="16" y="74" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Agent 1: Preprocessor</text>
    <text x="16" y="96" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">Auto-clean, IQR, Sklearn</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(480, 230)">
    <rect width="240" height="120" rx="16" fill="#161619" stroke="#0071E3" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#0071E3" fill-opacity="0.15"/>
    <text x="24" y="38" fill="#0071E3" font-size="16">🏆</text>
    <text x="16" y="74" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Agent 2: ML Benchmark</text>
    <text x="16" y="96" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">7 Baseline Algos + Tuning</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(780, 230)">
    <rect width="240" height="120" rx="16" fill="#161619" stroke="#27272A" stroke-width="1"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#8B5CF6" fill-opacity="0.15"/>
