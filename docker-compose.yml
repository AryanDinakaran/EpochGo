services:
  epoch-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epoch-go-app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - PYTHONUNBUFFERED=1
    volumes:
      - ./projects:/app/projects
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: epoch-go-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
